# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: cross-harness-workflow-trigger-eval
description: Trigger regression checks for direct cross-harness collaboration, council planning, and artifact consolidation workflows.
skill: cross-harness-workflow
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for explicit cross-harness workflows, not ordinary subagents, single-harness planning, docs cleanup, or unrelated PR review.

tasks:
  - tasks/*.yaml
