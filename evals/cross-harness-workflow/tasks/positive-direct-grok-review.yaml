# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: cross-harness-workflow-positive-direct-grok-review
name: Positive - direct Grok review from Codex
description: The skill should trigger when Codex needs Grok CLI as an explicitly requested peer reviewer.
tags:
  - trigger
  - positive
inputs:
  prompt: "Ask Grok CLI to review Codex's current diff as a read-only peer and return findings first."
expected:
  should_trigger: true
graders:
  - name: should_trigger_direct_grok_review
    type: trigger
    config:
      skill_path: .codex/skills/cross-harness-workflow/SKILL.md
      mode: positive
      threshold: 0.6
