# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: cross-harness-workflow-negative-single-harness-plan
name: Negative - single harness plan
description: Asking one harness for a focused plan should not trigger the full multi-harness fan-out workflow.
tags:
  - trigger
  - negative
inputs:
  prompt: "Have Claude Code proofread docs/plans/platform-options-claude.md and suggest concise wording improvements."
expected:
  should_trigger: false
graders:
  - name: should_not_trigger_for_single_harness_plan
    type: trigger
    config:
      skill_path: .codex/skills/cross-harness-workflow/SKILL.md
      mode: negative
      threshold: 0.65
