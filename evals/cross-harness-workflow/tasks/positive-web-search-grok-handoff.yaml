# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: cross-harness-workflow-positive-web-search-grok-handoff
name: Positive - lane-selected Grok X research handoff
description: A source-native X research handoff to Grok should trigger direct cross-harness collaboration.
tags: [trigger, positive, grok, web-search]
inputs:
  prompt: "Use Grok for the lane-selected X-native pass on this literal x.com URL and include its replies."
expected:
  should_trigger: true
graders:
  - name: should_trigger_cross_harness_for_grok_x_research
    type: trigger
    config:
      skill_path: .codex/skills/cross-harness-workflow/SKILL.md
      mode: positive
      threshold: 0.4
