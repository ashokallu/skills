# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: cross-harness-workflow-positive-direct-muse-review
name: Positive - direct Muse council contribution
description: The skill should trigger when a parent asks Muse Spark to contribute a read-only council perspective.
tags:
  - trigger
  - positive
inputs:
  prompt: "Ask muse-spark-1.3-contributor for a read-only council contribution with one alternative implementation and its tradeoffs. Treat this repository as private, use a fresh ephemeral turn, and do not resume an unrelated or TUI-owned session."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_direct_muse_contribution
    type: trigger
    config:
      skill_path: .codex/skills/cross-harness-workflow/SKILL.md
      mode: positive
      threshold: 0.6
