# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: cross-harness-workflow-positive-direct-muse-implementation
name: Positive - Muse implementation worker
description: The skill should trigger when Codex Desktop must orchestrate Muse as a bounded implementation worker in an explicit worktree.
tags:
  - trigger
  - positive
inputs:
  prompt: "Run a direct cross-harness Muse CLI implementation handoff: keep Codex Desktop as the orchestrator, use muse-spark-1.3-contributor as the workhorse in a disposable worktree, monitor and safely interrupt or resume the Muse session, then have Codex validate the resulting Git changes."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_muse_implementation_worker
    type: trigger
    config:
      skill_path: .codex/skills/cross-harness-workflow/SKILL.md
      mode: positive
      threshold: 0.6
