# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: vr-failure-analyzer-trigger-eval
description: Trigger regression checks for intelligent visual-regression artifact and image analysis routing.
skill: vr-failure-analyzer
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for visual-regression image analysis and avoid generic E2E triage.

tasks:
  - tasks/*.yaml
