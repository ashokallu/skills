# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: readonly-data-access-trigger-eval
description: Trigger regression checks for read-only Cloud SQL and staging Mongo data-access workflows.
skill: readonly-data-access
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for read-only database evidence gathering and connection triage, not writes, migrations, local fixtures, or app code changes.

tasks:
  - tasks/*.yaml
