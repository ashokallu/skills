# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: code-authoring-behavior-eval
description: Cold-agent transfer-preflight, authoring-boundary, bounded critic-contact, database, and convention-selection checks.
skill: code-authoring
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 180
  parallel: false
  executor: copilot-sdk
  model: auto
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: authoring_behavior
    weight: 1
    threshold: 1
    description: Authors must transfer mandatory agreements into bounded prospective commitments, enforce terminal critic contacts, apply implementation decisions, and preserve final reviewer authority.

tasks:
  - behavior-tasks/*.yaml
