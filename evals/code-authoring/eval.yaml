# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: code-authoring-trigger-eval
description: Trigger regression checks for the example-app code authoring skill. This suite targets the Codex mirror. Mirror parity for selected runtime skills is checked by scripts/dev/check-agent-instruction-routing.sh outside Waza.
skill: code-authoring
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for code authoring, implementation hygiene, production data safety, and final-shape readiness, not for read-only final verdicts or generic non-repo advice.

tasks:
  - tasks/*.yaml
