# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-structured-data-surgery
name: Positive - structured data surgery
description: Surgical JSON or locale edits should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Use code-authoring for a surgical structured-data edit: update the locale JSON files under app/public/locales with no indentation churn, no unrelated formatting changes, and a tiny diff footprint."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_structured_data_surgery
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
