# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-backend-codegen-sql
name: Positive - backend SQL codegen lane
description: Backend sqlc query changes should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Use code-authoring's backend-codegen lane to add a new query to backend/internal/shared/sql/queries/user_experience.sql and regenerate the example-app backend sqlc output correctly."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_backend_codegen_sql_query
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
