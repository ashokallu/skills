# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-dx-tooling
name: Positive - DX tooling
description: Repo scripts, mise tasks, Docker compose, lint-only fixes, and validation tooling should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Add a mise task and helper script for a example-app validation workflow, preserve existing command compatibility, verify the task runs, and check CI references."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_dx_tooling
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
