# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-value-release-readiness
name: Positive - value and release readiness
description: Implementation closeout that checks value delivery, runtime proof, drift, release risk, and rollback should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Before handing off this user-facing implementation, check the value statement against Given/When/Then acceptance criteria, name runtime proof, drift, release risk, and rollback."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_value_release_readiness
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
