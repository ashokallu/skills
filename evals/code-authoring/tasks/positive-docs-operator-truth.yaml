# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-docs-operator-truth
name: Positive - docs and operator truth
description: Code or workflow changes that must keep docs, logs, runbooks, or operator text truthful should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Update a example-app job flag and its logs; use the docs-and-operator-truth lane so README text, CLI help, runbook steps, and runtime behavior stay aligned."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_docs_operator_truth
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
