# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-environment-config-secrets
name: Positive - environment config secrets
description: Environment key and secret-reference changes should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Add a new example-app environment variable and secret reference, update the typed config loader, .env.example, CI workflow env, deploy config, and prove non-production defaults cannot reach production datasets."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_environment_config_secrets
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
