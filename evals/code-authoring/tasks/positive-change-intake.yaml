# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-change-intake
name: Positive - change intake
description: Non-trivial code work that needs visible lane selection and code-change todo mapping should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "For this example-app refactor, start by classifying side effects, selecting the code authoring lanes, and preparing a code-change todo that maps each edit to the lane to load just before changing files."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_change_intake
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
