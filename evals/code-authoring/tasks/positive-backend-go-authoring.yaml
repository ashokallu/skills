# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-backend-go-authoring
name: Positive - backend Go authoring
description: Focused Go backend implementation should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Implement a example-app backend Go controller and datasource fix with explicit auth, ErrorToHTTPStatusCode mapping, context propagation, and focused backend tests."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_backend_go
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
