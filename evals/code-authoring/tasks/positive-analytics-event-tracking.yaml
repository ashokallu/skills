# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-analytics-event-tracking
name: Positive - analytics event tracking
description: Product analytics event contract changes should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Implement a example-app analytics change that renames an Amplitude event, changes a typed property, preserves dashboard consumers through a deprecation window, keeps consent gating, and updates the tracking plan."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_analytics_event_tracking
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
