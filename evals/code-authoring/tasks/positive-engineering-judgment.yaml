# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-engineering-judgment
name: Positive - engineering judgment
description: LLM coding footgun and overengineering checks should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Before refactoring this example-app handler, apply the engineering-judgment rules so we avoid speculative abstractions and keep the fix surgical."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_engineering_judgment_lane
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
