# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-cache-jobs-resilience
name: Positive - cache jobs resilience
description: Cache, async job, retry, idempotency, and run-state implementation should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Update a example-app Cloud Run job to process queued records in chunks, use an idempotency key, invalidate the right cache after durable success, handle retry and timeout states, and expose operator-visible run-state logs."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_cache_jobs_resilience
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
