# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-sanity-cms-endpoint
name: Positive - Sanity CMS endpoint lane
description: Adding a Sanity-backed endpoint should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Use code-authoring's sanity-schema lane to add a example-app CMS-backed API endpoint that fetches Sanity content by a legacy Mongo ID and preserves the existing cache behavior."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_sanity_schema_endpoint
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
