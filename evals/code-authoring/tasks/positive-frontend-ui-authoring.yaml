# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-frontend-ui-authoring
name: Positive - frontend UI authoring
description: Focused Next.js or React frontend implementation should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Implement a example-app frontend page change in app/pages using getLearnPageProps, typed requesters, i18n keys, accessible loading/error states, and focused tests."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_frontend_ui
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
