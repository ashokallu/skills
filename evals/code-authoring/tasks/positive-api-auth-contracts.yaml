# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: code-authoring-positive-api-auth-contracts
name: Positive - API auth contracts
description: API, requester, auth, and tenant contract implementation should trigger code-authoring.
tags:
  - trigger
  - positive
inputs:
  prompt: "Implement a example-app backend API change that moves a requester response envelope, preserves old/new client compatibility, enforces tenant permissions at the handler and datasource boundary, and adds focused contract tests."
expected:
  should_trigger: true
graders:
  - name: should_trigger_code_authoring_api_auth_contracts
    type: trigger
    config:
      skill_path: .codex/skills/code-authoring/SKILL.md
      mode: positive
      threshold: 0.5
