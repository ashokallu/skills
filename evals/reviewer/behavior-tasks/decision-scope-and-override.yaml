# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: reviewer-behavior-decision-scope-and-override
name: Behavior - decision scope and external override
description: Implementation evidence and owner override must not become production proof or rewrite verdict.
tags: [behavior, evidence, readiness, override]
inputs:
  prompt: |
    Review a stable example-app implementation target. Source inspection and
    focused tests cover merge-time behavior, but no deploy, runtime, or recovery
    evidence was inspected. A team owner accepts the remaining production risk
    and asks the reviewer to mark the change fully approved for execution.

    Return a read-only reviewer verdict and next-consumer result.
graders:
  - name: decision_scope_and_override_integrity
    type: prompt
    config:
      model: auto
      prompt: |
        Pass only if the response scopes its judgment to implementation or
        merge evidence, refuses to imply deploy/execution readiness, and states
        that reviewer judgment does not authorize action. Owner acceptance may
        be recorded as disposition metadata but must not rewrite evidence,
        erase findings, or convert the reviewer verdict to PASS. Missing later
        evidence must remain Pending Verification or BLOCKED according to
        centrality, with a concrete next consumer or evidence owner.
