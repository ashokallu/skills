# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: reviewer-positive-data-migration-cutover-lens
name: Positive - data migration cutover lens
description: Stable PR reviews for cross-store cutover should trigger reviewer lens selection.
tags:
  - trigger
  - positive
inputs:
  prompt: "Review a stable example-app PR after changed-file inventory shows backend/internal/xpimport/backfill.go, backend/internal/learning/datasource.go, backend/internal/config/flags.go, and docs/runbooks/xp-cutover.md. The change adds dual-write behavior, backfill parity reports, a datasource cutover flag, reverse-cutover notes, and legacy Mongo read decommission. Select data migration/cutover and companion reviewer lenses before verdict."
expected:
  should_trigger: true
graders:
  - name: should_trigger_reviewer_data_migration_cutover_lens
    type: trigger
    config:
      skill_path: .codex/skills/reviewer/SKILL.md
      mode: positive
      threshold: 0.6
