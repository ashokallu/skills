# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: reviewer-positive-environment-config-secrets-lens
name: Positive - environment config secrets lens
description: Stable PR reviews for environment config and secret references should trigger reviewer lens selection.
tags:
  - trigger
  - positive
inputs:
  prompt: "Review a stable example-app diff after changed-file inventory shows app/config/env.ts, .env.example, .github/workflows/deploy.yml, and infrastructure/modules/example-app/nextjs.tf. The PR adds a required environment key, changes a Sanity dataset default, and updates secret reference names. Select environment config/secrets, CI, security, docs, and rollout lenses before verdict."
expected:
  should_trigger: true
graders:
  - name: should_trigger_reviewer_environment_config_secrets_lens
    type: trigger
    config:
      skill_path: .codex/skills/reviewer/SKILL.md
      mode: positive
      threshold: 0.6
