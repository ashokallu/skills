# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: worktree-readiness-positive-create-worktree
name: Positive - create repo worktree
description: The skill should trigger when a new example-app worktree must be created and prepared.
tags:
  - trigger
  - positive
inputs:
  prompt: "Create a repo-local tmp/worktrees checkout for the example-app branch, install branch-local app dependencies, and make it ready for edits."
expected:
  should_trigger: true
graders:
  - name: should_trigger_worktree_setup
    type: trigger
    config:
      skill_path: .codex/skills/worktree-readiness/SKILL.md
      mode: positive
      threshold: 0.6
