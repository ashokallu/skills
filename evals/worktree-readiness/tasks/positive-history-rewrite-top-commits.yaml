# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: worktree-readiness-positive-history-rewrite-top-commits
name: Positive - history rewrite preserves lower commits
description: The skill should trigger before rewriting an open PR branch so the agent verifies the intended commit range, tree equivalence, and force-push boundary.
tags:
  - trigger
  - positive
inputs:
  prompt: "In this example-app PR worktree, squash only the top two fix commits into one and keep the lower feature commit separate. Verify the final tree did not change, then force-push with lease."
expected:
  should_trigger: true
graders:
  - name: should_trigger_history_rewrite_readiness
    type: trigger
    config:
      skill_path: .codex/skills/worktree-readiness/SKILL.md
      mode: positive
      threshold: 0.6
