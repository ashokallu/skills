# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: pr-workflow-behavior-eval
description: Cold-agent PR review checkout, output-contract, and review-comment fidelity checks.
skill: pr-workflow
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 180
  parallel: false
  executor: copilot-sdk
  model: auto
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: pr_workflow_behavior
    weight: 1
    threshold: 1
    description: PR review must honor supplied checkouts and preserve verdict and public-comment contracts.

tasks:
  - behavior-tasks/*.yaml
