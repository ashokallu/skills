# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-same-session-re-review
name: Positive - same-session PR re-review
description: The PR workflow should trigger when an exact reviewer session verifies its own findings against an ancestral fix batch.
tags:
  - trigger
  - positive
  - re-review
inputs:
  prompt: "Continue the exact reviewer session for PR 4810. Review its own F1 and F2 fixes in ancestral commit H1 against prior target H0, then return the scoped re-review result."
expected:
  should_trigger: true
graders:
  - name: should_trigger_same_session_re_review
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
