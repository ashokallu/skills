# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-copilot-review-comments
name: Positive - Copilot review comments require thread discovery
description: The skill should route PR prompts with Copilot review comments to the read-only comments lane before design advice.
tags:
  - trigger
  - positive
inputs:
  prompt: "Copilot left review comments for this PR - https://github.com/example-org/example-app/pull/104602 - first I want to discuss whether to lazy-load personality traits like reviewer. What do you think?"
expected:
  should_trigger: true
graders:
  - name: should_trigger_copilot_review_comment_read
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
