# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-current-ci-state
name: Positive - current CI state
description: The skill should trigger when the user asks for live PR CI state only.
tags:
  - trigger
  - positive
inputs:
  prompt: "For this example-app PR URL, inspect live status contexts and check runs and tell me whether CI is currently green. Do not create a worktree."
expected:
  should_trigger: true
graders:
  - name: should_trigger_ci_read
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
