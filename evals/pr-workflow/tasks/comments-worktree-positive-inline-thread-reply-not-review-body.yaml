# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-comments-worktree-positive-inline-thread-reply-not-review-body
name: Positive - inline thread reply not review body
description: Review-comment fixes must reply on the exact inline thread, not as a top-level PR review.
tags:
  - trigger
  - positive
inputs:
  prompt: "Copilot left an inline review thread on my example-app PR. Fix the valid comment, reply to the exact thread using the root comment ID, resolve the bot thread, avoid creating a top-level PR review comment, refresh the PR body, and wait for current-head CI."
expected:
  should_trigger: true
graders:
  - name: should_trigger_inline_thread_reply_not_review_body
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
