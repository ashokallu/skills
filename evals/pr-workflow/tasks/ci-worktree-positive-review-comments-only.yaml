# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-ci-worktree-review-comments-only
name: Positive - review comments route through umbrella
description: Review-comment inspection without CI reproduction should trigger the umbrella and route to a comments lane.
tags:
  - trigger
  - positive
inputs:
  prompt: "Read the requested changes from the example-app review threads and tell me which comments still need a reply."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_comments_read
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
