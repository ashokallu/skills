# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-comments-read-fix-feedback-worktree
name: Positive - fix review feedback routes through umbrella
description: Moving from comment triage to local fixes should trigger the umbrella and route to the comments-worktree lane.
tags:
  - trigger
  - positive
inputs:
  prompt: "Read the requested changes on this PR, create an isolated worktree, fix the valid review comments, and prepare replies for the threads."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_comment_fix_worktree
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.7
