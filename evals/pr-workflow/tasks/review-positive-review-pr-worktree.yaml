# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-review-pr-worktree
name: Positive - review PR in worktree
description: The skill should trigger when the user asks for a maintainer review of a PR using a local worktree.
tags:
  - trigger
  - positive
inputs:
  prompt: "Review https://github.com/example-org/example-app/pull/104492 like our reviewer agent. Create a pr-4492 worktree if needed and block if the branch is outdated."
expected:
  should_trigger: true
graders:
  - name: should_trigger_pr_review_worktree
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
