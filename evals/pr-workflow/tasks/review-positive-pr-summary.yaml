# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-review-pr-summary
name: Positive - PR metadata summary routes through umbrella
description: Plain PR metadata and comment summaries should trigger the umbrella and route to read-only lanes without creating a worktree.
tags:
  - trigger
  - positive
inputs:
  prompt: "Summarize PR 4492 comments, reviews, changed files, and current CI status. Do not create a local checkout."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_plain_pr_summary
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
