# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-pr-ci-failure
name: Positive - failing PR CI
description: The skill should trigger when a PR has failing CI that needs local reproduction.
tags:
  - trigger
  - positive
inputs:
  prompt: "https://github.com/example-org/example-app/pull/101234 has a failing Backend - Validate check. Inspect live CI and reproduce the concrete failing lane in a disposable worktree."
expected:
  should_trigger: true
graders:
  - name: should_trigger_pr_ci_worktree
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
