# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: pr-workflow-positive-reply-before-resolve
name: Positive - reply before resolve
description: The skill should trigger for review-thread follow-up requiring fixes and reviewer-facing replies.
tags:
  - trigger
  - positive
inputs:
  prompt: "Address the unresolved review threads on this example-app PR, prepare short thread replies, and resolve each fixed thread after validation."
expected:
  should_trigger: true
graders:
  - name: should_trigger_reply_resolve_flow
    type: trigger
    config:
      skill_path: .codex/skills/pr-workflow/SKILL.md
      mode: positive
      threshold: 0.6
