# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: pr-workflow-trigger-eval
description: Trigger regression checks for example-app PR workflow routing across publication, title/body refresh, review, read-only metadata/comments/CI, CI fixes, comment fixes, local PR gates, and bug-fix PR review.
skill: pr-workflow
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for PR workflows and route internally to the right lazy-loaded lane while still avoiding unrelated local closeout or generic worktree tasks.

tasks:
  - tasks/*.yaml
