# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: jira-agent-workflow-positive-create-ticket-dry-run-first
name: Positive - create ticket dry run first
description:
  The skill should trigger when the user asks for a new Jira issue, dry-run payload review, branch,
  and PR workflow.
tags:
  - trigger
  - positive
inputs:
  prompt:
    "Draft a Jira issue for this application bug, show me the create payload before writing it, then after
    I approve create the ticket, add it to my active board, create the Jira-keyed branch, fix it,
    and open a PR."
expected:
  should_trigger: true
graders:
  - name: should_trigger_create_ticket_dry_run_first
    type: trigger
    config:
      skill_path: .codex/skills/jira-agent-workflow/SKILL.md
      mode: positive
      threshold: 0.5
