# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: jira-agent-workflow-trigger-eval
description: Trigger regression checks for project Jira MCP and Jira-to-worktree-to-PR workflows.
skill: jira-agent-workflow
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description:
      The skill should trigger for Jira issue work and Jira-backed branch or PR workflow
      orchestration, not Confluence work, MCP setup, or unrelated GitHub work.

tasks:
  - tasks/*.yaml
