# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: agent-personality-trigger-eval
description: Trigger regression checks for the example-app agent personality skill.
skill: agent-personality
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for high-touch user-facing collaboration, not formal review packets or incident/status output.

tasks:
  - tasks/*.yaml
