# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: confluence-workflow-trigger-eval
description: Trigger regression checks for example-app Confluence workflows through the Atlassian MCP.
skill: confluence-workflow
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description:
      The skill should trigger for Confluence work through the Atlassian MCP, not Jira work,
      setup/smoke tasks, ordinary product work, or unrelated PR inspection.

tasks:
  - tasks/*.yaml
