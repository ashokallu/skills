# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: confluence-workflow-negative-token-drift-setup
name: Negative - PAT drift setup triage
description: Auth setup triage should not route to the reusable Confluence work skill.
tags:
  - trigger
  - negative
inputs:
  prompt:
    "Use the example-app Confluence workflow skill to triage a Confluence MCP 401 auth failure by
    checking PAT/env drift between tmp/confluence-jira-mcp.json and .envrc without printing secrets."
expected:
  should_trigger: false
graders:
  - name: should_not_trigger_pat_drift_setup
    type: trigger
    config:
      skill_path: .codex/skills/confluence-workflow/SKILL.md
      mode: negative
      threshold: 0.75
