# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: work-orchestration-trigger-eval
description: Trigger regression checks for the consolidated example-app work-orchestration umbrella skill.
skill: work-orchestration
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The umbrella should trigger as a lightweight dispatcher for repo work while still routing specialist domains to their owning skills after invocation.

tasks:
  - tasks/*.yaml
