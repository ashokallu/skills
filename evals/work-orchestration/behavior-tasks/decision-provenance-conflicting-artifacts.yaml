# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: work-orchestration-behavior-decision-provenance-conflicting-artifacts
name: Behavior - preserve conflicting requested artifacts without selecting policy
description: Correct evidence and a conflicting assessment must not authorize policy substitution in a requested durable plan.
tags: [behavior, objective-lock, decision-provenance, artifact-fidelity]
inputs:
  prompt: |
    The user asks for one durable document preserving the complete Production
    observation and the proposed per-user unresolved-mirror-failure fallback
    and bounded-repair PR plan. They also ask for a separate document preserving
    a supplied branch assessment that recommends direct Postgres selection with
    no automatic fallback. No owner decision chooses between those policies.

    Explain the authoring decision only. Do not inspect files or create or edit
    either document in this task. Stop after the explanation; do not lock a
    behavioral contract.
graders:
  - name: conflicting_artifacts_include_required_authority_fields
    type: text
    config:
      regex_match:
        - "(?i)discoverable facts"
        - "(?i)Pending Verification"
        - "(?i)artifact fidelity"
        - "(?i)packaging"
        - "(?i)execution authorization"
        - "(?i)owner-approved behavioral policy"
  - name: conflicting_artifacts_preserve_provenance
    type: prompt
    config:
      model: auto
      rubric: evals/work-orchestration/rubrics/decision-provenance-conflicting-artifacts.md
