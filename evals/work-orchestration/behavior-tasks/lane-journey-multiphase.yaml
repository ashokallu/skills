id: work-orchestration-behavior-lane-journey-multiphase
name: Behavior - narrate a multi-phase lane journey before acting
description: A parent makes authoring, validation, review, and commit ownership visible at their boundaries.
tags: [behavior, routing, journey, sequencing]
inputs:
