    local-commit journey. Do not inspect files, edit, validate, review, or
    commit in this task.
graders:
  - name: lane_journey_multiphase_contract
    type: prompt
    config:
      model: auto
      rubric: evals/work-orchestration/rubrics/lane-journey-multiphase.md
