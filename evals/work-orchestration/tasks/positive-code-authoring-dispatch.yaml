# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: work-orchestration-positive-code-authoring-dispatch
name: Positive - code authoring dispatch
description: The umbrella should trigger first for repo work and dispatch code writing phases to code-authoring.
tags:
  - trigger
  - positive
inputs:
