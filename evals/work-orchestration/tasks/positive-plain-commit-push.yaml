# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: work-orchestration-positive-plain-commit-push
name: Positive - plain commit and push
description: The umbrella should trigger before commit or push readiness work on non-trivial example-app changes.
tags:
  - trigger
  - positive
inputs:
  prompt: "Commit these example-app instruction changes and push the branch to remote."
expected:
  should_trigger: true
graders:
  - name: should_trigger_plain_commit_push
    type: trigger
    config:
      skill_path: .codex/skills/work-orchestration/SKILL.md
      mode: positive
      threshold: 0.5
