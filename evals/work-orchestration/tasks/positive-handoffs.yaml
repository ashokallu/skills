# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: work-orchestration-positive-handoffs
name: Positive - actionable handoff
description: The umbrella should trigger when a subagent must return the next owner in the expected format.
tags:
  - trigger
  - positive
inputs:
  prompt: "As a example-app Codex subagent, finish your scoped mapping and return an ACTIONABLE handoff with nextAgent, Objective, Scope, and Acceptance Criteria."
expected:
  should_trigger: true
graders:
  - name: should_trigger_handoffs_lane
    type: trigger
    config:
      skill_path: .codex/skills/work-orchestration/SKILL.md
      mode: positive
      threshold: 0.3
