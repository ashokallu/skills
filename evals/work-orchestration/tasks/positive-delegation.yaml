# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: work-orchestration-positive-delegation
name: Positive - work-start delegation
description: The umbrella should trigger before substantial example-app Codex implementation work begins.
tags:
