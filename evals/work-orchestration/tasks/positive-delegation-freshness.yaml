# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: work-orchestration-positive-delegation-freshness
name: Positive - delegation target freshness
description: Context-safe delegated evidence must retain target revision, scope, ownership, and join metadata.
tags:
  - trigger
  - positive
inputs:
  prompt: "Delegate a read-only caller and test inventory for the current example-app commit. Give the subagent a compact packet with target freshness, scope gaps, a join consumer, and acceptance evidence so a later branch move cannot turn stale output into proof."
expected:
  should_trigger: true
graders:
  - name: should_trigger_freshness_safe_delegation
    type: trigger
    config:
      skill_path: .codex/skills/work-orchestration/SKILL.md
      mode: positive
      threshold: 0.5
