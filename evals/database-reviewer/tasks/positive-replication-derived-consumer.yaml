# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: database-reviewer-positive-replication-derived-consumer
name: Positive - replication and derived-consumer review
description: Replica freshness, CDC replay, and projection compatibility require the database specialist.
tags: [trigger, positive, replication, cdc]
inputs:
