# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: database-reviewer-positive-destructive-down-review
name: Positive - destructive down and provenance review
description: Business-row cleanup, provenance, and rollback consequences require the DBA specialist.
tags: [trigger, positive, rollback, pr4708-seed]
inputs:
  prompt: "Perform a read-only DBA safety review of a pending Postgres migration under backend/internal/shared/sql/migrations whose down SQL deletes every business row with a non-null import run ID. Check organic provenance clearing, bounded cleanup, and recovery evidence."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_destructive_down
    type: trigger
    config:
      skill_path: .codex/skills/database-reviewer/SKILL.md
      mode: positive
      threshold: 0.6
