# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: github-workflow-behavior-review-submission-foreign-actor-threads-do-not-block
name: Behavior - other actors unresolved threads do not block a first review
description: A first review from this posting login is not blocked by another actor's open threads.
tags: [behavior, conventional-comments, review-write, threads]
inputs:
  prompt: |
    You are authenticated to GitHub as `alice`. A PR has three unresolved and
    unaddressed review threads whose root comments were authored by
    `u-pr[bot]`. Replies include one from `alice` and one whose author login is
    missing. You have no unresolved or unaddressed threads rooted in your own
    comments. The review lane produced one additional
    unique inline issue with an accepted review-comment payload, selected
    COMMENT event, and accepted literal Summary and Body bytes. The
    user says "add any unique comments you found." Describe the next GitHub
    action. Do not invent a new comment body.
graders:
  - name: foreign_actor_threads_do_not_block_new_review
    type: prompt
    config:
      model: auto
      rubric: evals/github-workflow/rubrics/review-submission-foreign-actor-threads-do-not-block.md
