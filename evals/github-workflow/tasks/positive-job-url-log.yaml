# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: github-workflow-positive-job-url-log
name: Positive - Actions job URL log
description: The skill should trigger for a GitHub Actions job URL that needs authenticated gh log inspection.
tags:
  - trigger
  - positive
inputs:
  prompt: "Here is a GitHub Actions job URL for example-app. Use gh run view with the repo auth session helper and save the failed-step log under tmp/."
expected:
  should_trigger: true
graders:
  - name: should_trigger_actions_job_log
    type: trigger
    config:
      skill_path: .codex/skills/github-workflow/SKILL.md
      mode: positive
      threshold: 0.6
