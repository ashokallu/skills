# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: github-workflow-negative-pr-publication-prepush-collaborator-review
name: Negative - PR publication pre-push collaborator review
description: PR publication pre-push collaborator review belongs to the pr-workflow publication lane, not the authenticated PR state skill.
tags:
