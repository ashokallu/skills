# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: connect-backend-services-positive-restart-dev-server
name: Positive - restart connect-backend dev_server
description: Managing connect-backend mp/dev_server processes should trigger this skill.
tags:
  - trigger
  - positive
