# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: connect-backend-services-trigger-eval
description: Trigger regression checks for local connect-backend service management.
skill: connect-backend-services
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for connect-backend dev_server process management, not ordinary app frontend or browser E2E work.

tasks:
  - tasks/*.yaml
