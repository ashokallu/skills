# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: browser-e2e-positive-mcp-auth
name: Positive - MCP browser auth
description: Codex Playwright MCP auth debugging should trigger the browser/E2E umbrella skill and then route to the MCP lane.
tags:
  - trigger
  - positive
inputs:
  prompt: "Use Codex Playwright MCP browser tools to log into app-local, prove auth through :4444/api/users/me, and verify a route."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_mcp_browser_auth
    type: trigger
    config:
      skill_path: .codex/skills/browser-e2e/SKILL.md
      mode: positive
      threshold: 0.60
