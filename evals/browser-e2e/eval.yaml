# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: browser-e2e-trigger-eval
description: Trigger regression checks for example-app browser, E2E, Playwright CLI, and Playwright MCP routing.
skill: browser-e2e
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for browser/E2E/Playwright work and avoid unrelated non-browser diagnosis.

tasks:
  - tasks/*.yaml
