# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: claude-code-configuration-negative-generated-verifier-script
name: Negative - generated verifier script
description: The skill should reject all-in-one generated verifier scripts and prefer small commands.
tags:
  - trigger
  - negative
inputs:
  prompt: "For Claude Code setup, run one big Python heredoc that checks installation, writes settings.local.json, parses every config file, resolves MCP state, maybe installs packages, and runs claude doctor."
expected:
  should_trigger: false
graders:
  - name: agents_skill_should_reject_big_script
    type: trigger
    config:
      skill_path: .agents/skills/claude-code-configuration/SKILL.md
      mode: negative
      threshold: 0.75
  - name: claude_skill_should_reject_big_script
    type: trigger
    config:
      skill_path: .claude/skills/claude-code-configuration/SKILL.md
      mode: negative
      threshold: 0.75
