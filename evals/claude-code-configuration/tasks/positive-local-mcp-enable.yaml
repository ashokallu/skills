# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: claude-code-configuration-positive-local-mcp-enable
name: Positive - local MCP enablement
description: The skill should trigger when a user asks to enable a declared Claude Code MCP locally.
tags:
  - trigger
  - positive
inputs:
  prompt: "Enable the GitHub MCP for Claude Code for my local setup only. Keep repo defaults disabled and write any user-specific enablement to .claude/settings.local.json."
expected:
  should_trigger: true
graders:
  - name: agents_skill_should_trigger_mcp_enable
    type: trigger
    config:
      skill_path: .agents/skills/claude-code-configuration/SKILL.md
      mode: positive
      threshold: 0.6
  - name: claude_skill_should_trigger_mcp_enable
    type: trigger
    config:
      skill_path: .claude/skills/claude-code-configuration/SKILL.md
      mode: positive
      threshold: 0.6
