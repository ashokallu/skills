# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: claude-code-configuration-trigger-eval
description: Trigger regression checks for Claude Code setup and configuration skills.
skill: claude-code-configuration
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.agents/skills
    - ../../.claude/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for Claude Code setup/configuration work, not ordinary repo validation.

tasks:
  - tasks/*.yaml
