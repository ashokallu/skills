# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: oracle-trigger-eval
description: Trigger regression checks for browser-only Oracle second-model review workflows.
skill: oracle
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for Oracle browser-mode cross-validation, not ordinary local review or API-mode requests.

tasks:
  - tasks/*.yaml
