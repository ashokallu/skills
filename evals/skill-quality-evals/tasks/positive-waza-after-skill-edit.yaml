# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: skill-quality-evals-positive-waza-after-skill-edit
name: Positive - Waza after skill edit
description: The skill should trigger when a skill was edited and the user asks for Waza evaluation.
tags:
  - trigger
  - positive
inputs:
  prompt: "I updated .codex/skills/pr-workflow/SKILL.md. Run Waza for the changed skill and tell me whether the trigger eval still passes."
expected:
  should_trigger: true
graders:
  - name: should_trigger_waza_after_skill_edit
    type: trigger
    config:
      skill_path: .codex/skills/skill-quality-evals/SKILL.md
      mode: positive
      threshold: 0.6
