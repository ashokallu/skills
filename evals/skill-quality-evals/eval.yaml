# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: skill-quality-evals-trigger-eval
description: Trigger regression checks for Waza-based skill quality evaluation after repo skill edits.
skill: skill-quality-evals
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
  model: mock-trigger-grader
  skill_directories:
    - ../../.codex/skills

metrics:
  - name: trigger_precision
    weight: 1
    threshold: 0.8
    description: The skill should trigger for Waza and mirrored skill quality checks, not ordinary code validation.

tasks:
  - tasks/*.yaml
