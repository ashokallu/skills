# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: improve-positive-deep-roadmap
name: Positive - deep roadmap audit
description: A deep grounded roadmap request should trigger improve.
tags:
  - trigger
  - positive
inputs:
  prompt: "Deeply inspect the current example-app product intent and code, then produce grounded roadmap options for maintainers to evaluate later."
expected:
  should_trigger: true
graders:
  - name: should_trigger_deep_roadmap
    type: trigger
    config:
      skill_path: .codex/skills/improve/SKILL.md
      mode: positive
      threshold: 0.55
