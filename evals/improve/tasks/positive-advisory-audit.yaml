# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: improve-positive-advisory-audit
name: Positive - advisory audit
description: A repo improvement audit that should produce prioritized findings and plans should trigger improve.
tags:
  - trigger
  - positive
inputs:
  prompt: "Run a read-only audit of this example-app codebase, find the highest-value improvement opportunities, and write self-contained implementation plans for another agent to execute later."
expected:
  should_trigger: true
graders:
  - name: should_trigger_advisory_audit
    type: trigger
    config:
      skill_path: .codex/skills/improve/SKILL.md
      mode: positive
      threshold: 0.6
