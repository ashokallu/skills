# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: improve-positive-single-plan
name: Positive - cold executor plan
description: A self-contained later-execution plan should trigger improve.
tags:
  - trigger
  - positive
inputs:
  prompt: "Write one self-contained cold-executor plan for consolidating the duplicated course-progress adapters. Do not edit source code."
expected:
  should_trigger: true
graders:
  - name: should_trigger_single_plan
    type: trigger
    config:
      skill_path: .codex/skills/improve/SKILL.md
      mode: positive
      threshold: 0.55
