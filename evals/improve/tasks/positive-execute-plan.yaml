# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: improve-positive-execute-plan
name: Positive - explicit execute handoff
description: An explicit improve execute request should trigger improve before returning to normal orchestration.
tags:
  - trigger
  - positive
inputs:
  prompt: "Use improve execute advisor-plans/003-cache-cleanup.md and hand the accepted specification to the normal example-app implementation workflow."
expected:
  should_trigger: true
graders:
  - name: should_trigger_execute_handoff
    type: trigger
    config:
      skill_path: .codex/skills/improve/SKILL.md
      mode: positive
      threshold: 0.55
