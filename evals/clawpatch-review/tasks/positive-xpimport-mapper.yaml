# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: clawpatch-review-positive-xpimport-mapper
name: Positive - XP import mapper config
description: The skill should trigger when Clawpatch broad mapping missed backend implementation files and a scoped mapper config is needed.
tags:
  - trigger
  - positive
inputs:
  prompt: "Clawpatch reviewed only XP import tests in this worktree. Configure the mapper so it includes backend/internal/xpimport implementation files and rerun the Clawpatch review."
expected:
  should_trigger: true
graders:
  - name: should_trigger_xpimport_mapper_config
    type: trigger
    config:
      skill_path: .codex/skills/clawpatch-review/SKILL.md
      mode: positive
      threshold: 0.6
