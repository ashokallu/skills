# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: clawpatch-review-positive-codex-sol-default
name: Positive - Codex Sol Clawpatch default
description: The skill should trigger when a scoped Clawpatch review must retain the repo Codex Sol and high provider default.
tags:
  - trigger
  - positive
inputs:
  prompt: "Run a scoped Clawpatch review and keep the repo provider default at gpt-5.6-sol with high reasoning."
expected:
  should_trigger: true
graders:
  - name: should_trigger_for_codex_sol_clawpatch_default
    type: trigger
    config:
      skill_path: .codex/skills/clawpatch-review/SKILL.md
      mode: positive
      threshold: 0.6
